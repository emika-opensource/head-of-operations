<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COO Operations Dashboard | Emika</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="18" height="18" rx="2" fill="#d4a574"/>
                        <path d="M12 8v8M8 12h8" stroke="#06060a" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>COO Dashboard</span>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h18M3 6h18M3 18h18"/>
                    </svg>
                </button>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" data-view="workflows">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span>Workflows</span>
                </button>
                <button class="nav-item" data-view="tasks">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                    </svg>
                    <span>Tasks</span>
                </button>
                <button class="nav-item" data-view="communication">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>Communication</span>
                </button>
                <button class="nav-item" data-view="metrics">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3v18h18"/>
                        <path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/>
                    </svg>
                    <span>Metrics</span>
                </button>
            </nav>

            <div class="sidebar-section">
                <h3 class="section-title">Team Directory</h3>
                <div id="teamDirectory" class="team-directory">
                    <div class="loading">Loading team...</div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <h1 id="pageTitle">Operations Overview</h1>
                <div class="header-actions">
                    <button class="refresh-btn" id="refreshBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"/>
                            <polyline points="1 20 1 14 7 14"/>
                            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                        </svg>
                        Refresh
                    </button>
                </div>
            </header>

            <!-- Workflows View -->
            <div id="workflowsView" class="content-view active">
                <div class="kanban-board">
                    <div class="kanban-column" data-status="pending">
                        <h3 class="column-header">
                            <span class="column-title">Pending</span>
                            <span class="column-count" id="pendingCount">0</span>
                        </h3>
                        <div class="column-content" id="pendingColumn"></div>
                    </div>
                    <div class="kanban-column" data-status="in_progress">
                        <h3 class="column-header">
                            <span class="column-title">In Progress</span>
                            <span class="column-count" id="inProgressCount">0</span>
                        </h3>
                        <div class="column-content" id="inProgressColumn"></div>
                    </div>
                    <div class="kanban-column" data-status="in_review">
                        <h3 class="column-header">
                            <span class="column-title">In Review</span>
                            <span class="column-count" id="inReviewCount">0</span>
                        </h3>
                        <div class="column-content" id="inReviewColumn"></div>
                    </div>
                    <div class="kanban-column" data-status="completed">
                        <h3 class="column-header">
                            <span class="column-title">Completed</span>
                            <span class="column-count" id="completedCount">0</span>
                        </h3>
                        <div class="column-content" id="completedColumn"></div>
                    </div>
                </div>
            </div>

            <!-- Tasks View -->
            <div id="tasksView" class="content-view">
                <div class="tasks-grid" id="tasksGrid">
                    <div class="loading">Loading tasks...</div>
                </div>
            </div>

            <!-- Communication View -->
            <div id="communicationView" class="content-view">
                <div class="communication-log" id="communicationLog">
                    <div class="loading">Loading communication history...</div>
                </div>
            </div>

            <!-- Metrics View -->
            <div id="metricsView" class="content-view">
                <div class="metrics-grid">
                    <div class="metric-card">
                        <h3>Agent Turns Used</h3>
                        <div class="metric-value" id="agentTurns">-</div>
                    </div>
                    <div class="metric-card">
                        <h3>Avg. Time Per Step</h3>
                        <div class="metric-value" id="avgTime">-</div>
                    </div>
                    <div class="metric-card">
                        <h3>Review Rounds</h3>
                        <div class="metric-value" id="reviewRounds">-</div>
                    </div>
                    <div class="metric-card">
                        <h3>Total Cost</h3>
                        <div class="metric-value" id="totalCost">-</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
